[workspace]
resolver = "2"
members = ["crates/convergio-scheduler"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/Roberdan/convergio-scheduler"

[workspace.dependencies]
# SDK dependencies (crates.io)
convergio-types = "0.1.6"
convergio-db = "0.1.6"

# Common deps — pin same versions as SDK for compatibility
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
axum = { version = "0.7", features = ["ws", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
