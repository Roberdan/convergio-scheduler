[workspace]
resolver = "2"
members = ["crates/convergio-scheduler"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "LicenseRef-Convergio-Community"
repository = "https://github.com/Roberdan/convergio-scheduler"

[workspace.dependencies]
# SDK dependencies
convergio-types = { git = "https://github.com/Roberdan/convergio-sdk", tag = "v0.1.9" }
convergio-db = { git = "https://github.com/Roberdan/convergio-sdk", tag = "v0.1.9" }

# Common deps — pin same versions as SDK for compatibility
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
axum = { version = "0.7", features = ["ws", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
